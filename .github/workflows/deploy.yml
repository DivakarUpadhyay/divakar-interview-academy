# Build and publish DevLadder from GitHub's servers on every push to main, so a deploy never depends on the
# owner's internet connection (a phone hotspot kept dropping the 7,000-file upload from the PC).
# Needs one repository secret: CLOUDFLARE_API_TOKEN (a Cloudflare API token with Cloudflare Pages: Edit).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "MONETIZATION_SETUP.md", ".github/workflows/page-speed.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip quietly until the CLOUDFLARE_API_TOKEN secret has been added (deploys from the PC still work meanwhile).
    if: ${{ vars.GITHUB_DEPLOY == 'on' }}
    env:
      NEXT_PUBLIC_ADSENSE_CLIENT: ca-pub-4620362748422172   # public publisher id, already visible in every page's HTML
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b8e4d7f71a8ab54f70cb3054b843181c   # account ids are not secret
        run: npx --yes wrangler@4.151.2 pages deploy out --project-name devladder --branch main --commit-dirty=true
      - name: Tell search engines (IndexNow)
        run: node scripts/indexnow.mjs || true
